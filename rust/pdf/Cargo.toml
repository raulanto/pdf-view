[package]
name = "pdf-view-backend"
version = "0.5.0"
edition = "2021"

[dependencies]
libc = "0.2"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.18"
url = "2"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest"] }

[[bin]]
name = "pdf-view-backend"
path = "src/main.rs"

[[bin]]
name = "pdf-worker"
path = "src/worker.rs"

[[bin]]
name = "sandbox-probe"
path = "src/probe.rs"
